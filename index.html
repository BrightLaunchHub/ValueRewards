      gap: 12px;

      justify-content: center;

    .hero h1 i {

    .stats-card {

    .legend {

    }

    .legend span {

      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    .dot {

      border-radius: 50%;

    .dot.active {

    .section-title {

      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #0a0a1a;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      max-height: 50vh;
      overflow-y: auto;

    .btn-grid::-webkit-scrollbar {

    }

      border-radius: 10px;

    .offer-btn:hover {

      border-color: #fb923c;

    .offer-btn.disabled {

      cursor: not-allowed;

    .btn-left {

      min-width: 28px;
      text-align: center;
    }
    .btn-left span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .click-count {
      background: #00000055;
      border-radius: 40px;
      padding: 3px 12px;
      font-size: 0.8rem;
      font-weight: 800;
      color: #fdba74;

    .offer-btn.clicked .click-count {

      border-radius: 50px;
      padding: 6px 18px;
      font-size: 0.85rem;

    }

    @media (max-width: 850px) {
      .main-container { flex-direction: column; }
      .level-sidebar { display: none; }
      .mobile-tier-bar {
        display: block;
        background: rgba(15, 20, 35, 0.85);
        backdrop-filter: blur(16px);
        border-radius: 1.5rem;
        padding: 1rem;
        margin-bottom: 1.5rem;
        border: 1px solid rgba(251, 146, 60, 0.5);
      }
      .mobile-tier-bar h3 {
        color: #ffd6a5;
        font-size: 1rem;
        text-align: center;
        margin-bottom: 0.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .mobile-triggers {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }
      .mobile-tier-btn {
        background: linear-gradient(105deg, #1a1e32, #11152a);
        border: 1px solid #fb923c;
        border-radius: 60px;
        padding: 6px 0;
        font-weight: 700;
        font-size: 0.65rem;
        color: #ffdead;
        cursor: pointer;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }
      .mobile-tier-btn i { font-size: 0.65rem; color: #fb923c; }
      .mobile-tier-btn.active {
        background: linear-gradient(105deg, #ea580c, #c2410c);
        border-color: #fdba74;
        color: white;
      }
      .btn-grid { max-height: 45vh; }
      .stats-card { margin-top: 1.5rem; }
    }
    @media (min-width: 851px) {
      .mobile-tier-bar { display: none; }
    }
  </style>
</head>

<script>
  // ==================== 30 NEW LINKS (heavenlysuspicious.com) ====================
  const ALL_LINKS = [

    "https://heavenlysuspicious.com/upfc4nd75?key=5e71b9afea650f36295d57b385d47cd2",
    "https://heavenlysuspicious.com/y8g21wnqc3?key=8a82acd88e9263a3ab62527482110226",
    "https://heavenlysuspicious.com/itrb3bgr?key=80cdfbb0de23b40bb7c73d540243b2a7",
    "https://heavenlysuspicious.com/vrtitd2t?key=241178269212bdbe03cdb4b400c036e1",
    "https://heavenlysuspicious.com/f5nx30nvmg?key=b408123ed3c464133649790bd14ab1c4",
    "https://heavenlysuspicious.com/xq6e48uc7?key=bb4036f021abd94d0e3798ad85782636",
    "https://heavenlysuspicious.com/hjnfpe6t?key=78f3d58eb406616a9c7bd0cf2c380caa",
    "https://heavenlysuspicious.com/x6kebp1fv?key=f739dd388804a9d9a1ba76990b9d5690",
    "https://heavenlysuspicious.com/akgcapcmt?key=4fcc937dc5ab63f82a039ddc8f967eef",
    "https://heavenlysuspicious.com/z0yuc2iffh?key=6140ee2dad997214b53044fb40c3b17f",
    "https://heavenlysuspicious.com/xpa2phbn7?key=f34c1becad2c64d696383b84004a0e86",
    "https://heavenlysuspicious.com/ftm181c47?key=82e54a2243d985afbac21b229264ddf1",
    "https://heavenlysuspicious.com/ddmxs8rn?key=c89e0f906774843479e56d73844fab95",
    "https://heavenlysuspicious.com/y3ncwzapsv?key=dd4ebb0eb4503d13f450ae6f31507062",
    "https://heavenlysuspicious.com/gcu6ec4n?key=d9d4742502ccd6cf7a613a55ae4978e7",
    "https://heavenlysuspicious.com/u5zqpfjv?key=eb0470c23e130feaacce148bfd3e897e",
    "https://heavenlysuspicious.com/zvij6jfja8?key=1f1556f4805d0d424efa18ec9c369ae6",
    "https://heavenlysuspicious.com/qsddyrj1?key=d2ba8512425c134c39379cd2bfd4827d"
  ];

  // ========== USER-FRIENDLY & AD-COMPLIANT OFFER NAMES (30 unique, warm & genuine) ==========
  const OFFER_NAMES = [
    "✨ Kind Rewards Pass", "🎁 Gentle Bonus Pack", "💎 Pure Value Token", "⚡ Smooth Access Gift", "🍀 Lucky Daily Deal",
    "🏆 Simple Achievement", "🚀 Easy Boost Voucher", "🎯 Friendly Bonus", "🔑 Quiet Rewards Key", "📀 Soft Digital Pack",
    "🕹️ Calm Player Perk", "🎧 Gentle Audio Bonus", "📱 Light Mobile Reward", "💡 Bright Simple Offer", "🛡️ Cozy Secure Pack",
    "📚 Warm Insider Deal", "🎨 Kind Creator Bonus", "⚙️ Easy Utility Perk", "🔔 Gentle Flash Deal", "🌐 Soft Global Reward",
    "🧩 Friendly Mystery Box", "🎵 Calm Sound Perk", "📸 Soft Snapshot Deal", "🕶️ Gentle Stealth Pack", "🌿 Pure Lucky Leaf",
    "🧭 Kind Navigator Deal", "🎲 Simple Dice Bonus", "🃏 Gentle Wild Reward", "🎈 Soft Celebration Pack", "⭐ Pure Value Bonus"
  ];

  // Matching icons for each offer
  const OFFER_ICONS = [
    "star", "gift", "gem", "bolt", "leaf", "trophy", "rocket", "bullseye", "key", "database",
    "gamepad", "headphones", "mobile-alt", "lightbulb", "shield-alt", "book", "palette", "cogs", "bell", "globe",
    "puzzle-piece", "music", "camera", "sunglasses", "leaf", "compass", "dice-d6", "star-of-life", "balloon", "crown"
  ];

  // Shuffle array utility (Fisher-Yates) for unique order per user
  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Get persistent shuffled order for this user
  function getShuffledIndices() {
    const ORDER_KEY = "valueRewardsShuffledOrderV1";
    const saved = localStorage.getItem(ORDER_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed.length === 30) return parsed;
    }
    const indices = Array.from({ length: 30 }, (_, i) => i);
    shuffleArray(indices);
    localStorage.setItem(ORDER_KEY, JSON.stringify(indices));
    return indices;
  }

  const shuffledOrder = getShuffledIndices();

  // Build tier offers using shuffled order (3 per tier)
  const TIER_OFFERS = {};
  for (let tier = 1; tier <= 10; tier++) {
    TIER_OFFERS[tier] = [];
    for (let j = 0; j < 3; j++) {
      const globalIdx = shuffledOrder[(tier - 1) * 3 + j];
      TIER_OFFERS[tier].push({
        name: OFFER_NAMES[globalIdx % OFFER_NAMES.length],
        icon: OFFER_ICONS[globalIdx % OFFER_ICONS.length],
        link: ALL_LINKS[globalIdx],
        originalIndex: globalIdx
      });
    }
  }

  const TOTAL_OFFERS = 30;
  let clickCounts = new Array(TOTAL_OFFERS).fill(0);
  let claimedStatus = new Array(TOTAL_OFFERS).fill(false);
  const STORAGE_KEY = "valueRewardsClicksV1";
  const CLAIMED_KEY = "valueRewardsClaimedV1";

  function loadCounts() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        let arr = JSON.parse(saved);
        if (arr.length === TOTAL_OFFERS) clickCounts = arr;
      } catch(e) {}
    }
    const savedClaimed = localStorage.getItem(CLAIMED_KEY);
    if (savedClaimed) {
      try {
        let arr = JSON.parse(savedClaimed);
        if (arr.length === TOTAL_OFFERS) claimedStatus = arr;
      } catch(e) {}
    }
  }
  function saveCounts() { 
    localStorage.setItem(STORAGE_KEY, JSON.stringify(clickCounts));
    localStorage.setItem(CLAIMED_KEY, JSON.stringify(claimedStatus));
  }
  function updateTotalDisplay() {
    const total = clickCounts.reduce((a,b)=>a+b,0);
    document.getElementById("totalClicks").innerText = total;
  }

  let currentTier = 1;

  function renderCurrentTier() {
    const grid = document.getElementById("offersGrid");
    grid.innerHTML = "";
    const offers = TIER_OFFERS[currentTier];
    const tierNames = ["Starter Pack", "Bronze Tier", "Silver Tier", "Gold Tier", "Platinum Tier", "Emerald Tier", "Ruby Tier", "Sapphire Tier", "Diamond Tier", "Ultimate Vault"];
    const levelTitle = document.getElementById("levelName");
    const levelBadge = document.getElementById("levelBadge");
    levelTitle.innerText = `Tier ${currentTier} · ${tierNames[currentTier-1]}`;
    levelBadge.innerText = "3 Offers";

    offers.forEach((offer) => {
      const globalIdx = offer.originalIndex;
      const count = clickCounts[globalIdx];
      const isClaimed = claimedStatus[globalIdx];
      const hasClick = count > 0;
      
      const btn = document.createElement("a");
      if (!isClaimed) {
        btn.href = offer.link;
        btn.target = "_blank";
        btn.rel = "noopener noreferrer";
      } else {
        btn.href = "javascript:void(0);";
      }
      btn.className = `offer-btn ${hasClick ? "clicked" : ""} ${isClaimed ? "disabled" : ""}`;
      btn.setAttribute("data-global", globalIdx);
      
      btn.innerHTML = `<div class="btn-left"><i class="fas fa-${offer.icon}"></i><span>${offer.name}</span></div><div class="click-count">${count}</div>`;
      
      if (!isClaimed) {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (claimedStatus[globalIdx]) return false;
          
          // One-time claim: mark claimed and increment
          claimedStatus[globalIdx] = true;
          clickCounts[globalIdx] += 1;
          saveCounts();
          updateTotalDisplay();
          renderCurrentTier();  // re-render to disable this button
          
          // Open link in new tab
          window.open(offer.link, "_blank");
          return false;
        });
      } else {
        btn.style.cursor = "not-allowed";
        btn.onclick = (e) => { e.preventDefault(); return false; };
      }
      
      grid.appendChild(btn);
    });
  }

  function setActiveTier(tier) {
    currentTier = tier;
    document.querySelectorAll(".level-btn").forEach(btn => {
      if (parseInt(btn.getAttribute("data-level")) === tier) btn.classList.add("active");
      else btn.classList.remove("active");
    });
    document.querySelectorAll(".mobile-tier-btn").forEach(btn => {
      if (parseInt(btn.getAttribute("data-level")) === tier) btn.classList.add("active");
      else btn.classList.remove("active");
    });
    renderCurrentTier();
  }

  function resetCounters() {
    for (let i = 0; i < TOTAL_OFFERS; i++) {
      clickCounts[i] = 0;
      claimedStatus[i] = false;
    }
    saveCounts();
    updateTotalDisplay();
    renderCurrentTier();
  }

  function buildTriggers() {
    const desktopContainer = document.getElementById("desktopTriggers");
    const mobileContainer = document.getElementById("mobileTriggers");
    desktopContainer.innerHTML = "";
    mobileContainer.innerHTML = "";
    for (let i = 1; i <= 10; i++) {
      const dBtn = document.createElement("div");
      dBtn.className = "level-btn";
      dBtn.setAttribute("data-level", i);
      dBtn.innerHTML = `<i class="fas fa-tag"></i> ${i}`;
      dBtn.addEventListener("click", () => setActiveTier(i));
      desktopContainer.appendChild(dBtn);
      const mBtn = document.createElement("div");
      mBtn.className = "mobile-tier-btn";
      mBtn.setAttribute("data-level", i);
      mBtn.innerHTML = `<i class="fas fa-tag"></i> ${i}`;
      mBtn.addEventListener("click", () => setActiveTier(i));
      mobileContainer.appendChild(mBtn);
    }
  }

  document.getElementById("resetAllBtn").addEventListener("click", resetCounters);
  loadCounts();
  buildTriggers();
  setActiveTier(1);
  updateTotalDisplay();
</script>
</body>
</html>
